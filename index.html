<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Happy Birthday Anggi!</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas {
    display: block;
    touch-action: none;                    /* no scrolling / zooming on phones */
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
</style>
</head>
<body>
<canvas id="screen"></canvas>

<script>
// =============================================================
// 1. SETTINGS - change these to personalise the page
// =============================================================
const CONFIG = {
  name:  "Anggi",
  line1: "Happy Birthday",
  wish:  "Make a wish!",
  from:  "From Dylan",
};

// =============================================================
// 2. CANVAS SETUP
// Everything is drawn on a 360 x 720 "design" area (a phone held
// upright). The design area is scaled to fit any real screen.
// =============================================================
const DESIGN_W = 360, DESIGN_H = 720;
const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");

let dpr = 1, scale = 1, offX = 0, offY = 0;
// The visible area in design coordinates (wider/taller than 360x720
// when the screen shape is different) - used by the background effects.
const view = { left: 0, right: DESIGN_W, top: 0, bottom: DESIGN_H };

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);   // cap at 2x for speed
  canvas.width  = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  canvas.style.width  = w + "px";
  canvas.style.height = h + "px";
  scale = Math.min(w / DESIGN_W, h / DESIGN_H);
  offX = (w - DESIGN_W * scale) / 2;
  offY = (h - DESIGN_H * scale) / 2;
  view.left   = -offX / scale;
  view.right  = DESIGN_W + offX / scale;
  view.top    = -offY / scale;
  view.bottom = DESIGN_H + offY / scale;
}
window.addEventListener("resize", resize);
resize();

// Small math helpers
const rand    = (a, b) => a + Math.random() * (b - a);
const clamp01 = v => Math.max(0, Math.min(1, v));
const easeOut = t => 1 - Math.pow(1 - t, 3);
const lerp    = (a, b, t) => a + (b - a) * t;

// =============================================================
// 3. DRAWING HELPERS
// One glowing dot is pre-drawn once as a small image ("sprite"),
// then stamped everywhere. Much faster than drawing glow every time.
// =============================================================
const SPRITE = document.createElement("canvas");
SPRITE.width = SPRITE.height = 64;
{
  const g = SPRITE.getContext("2d");
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0.00, "rgba(255,255,255,1)");
  grad.addColorStop(0.30, "rgba(255,255,255,0.95)");
  grad.addColorStop(0.42, "rgba(255,255,255,0.3)");
  grad.addColorStop(1.00, "rgba(255,255,255,0)");
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
}

function dot(x, y, size, alpha) {
  if (alpha <= 0.01) return;
  ctx.globalAlpha = Math.min(1, alpha);
  const r = size * 2.5;
  ctx.drawImage(SPRITE, x - r, y - r, r * 2, r * 2);
}

// Normal (non-dot) small text, used only for hints like "tap to play"
function label(text, x, y, size, alpha) {
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#fff";
  ctx.font = size + "px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, x, y);
}

// =============================================================
// 4. SOUND - the melody is generated by code (Web Audio API)
// =============================================================
let audio = null, noiseBuf = null;
let musicOn = false, musicTimer = null, musicNodes = [];

const NOTE = { G4: 392.00, A4: 440.00, B4: 493.88, C5: 523.25, D5: 587.33,
               E5: 659.25, F5: 698.46, G5: 783.99, C6: 1046.50 };
// "Happy Birthday to You": [note, length in beats]
const SONG = [
  ["G4", .75], ["G4", .25], ["A4", 1], ["G4", 1], ["C5", 1], ["B4", 2],
  ["G4", .75], ["G4", .25], ["A4", 1], ["G4", 1], ["D5", 1], ["C5", 2],
  ["G4", .75], ["G4", .25], ["G5", 1], ["E5", 1], ["C5", 1], ["B4", 1], ["A4", 2],
  ["F5", .75], ["F5", .25], ["E5", 1], ["C5", 1], ["D5", 1], ["C5", 2],
];
const BEAT = 0.42;   // seconds per beat

// Phones only allow sound after a tap, so this runs on the first tap.
function initAudio() {
  if (audio) { audio.resume(); return; }
  audio = new (window.AudioContext || window.webkitAudioContext)();
  // 1 second of random "white noise", reused for whoosh and pop sounds
  noiseBuf = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}

function tone(freq, start, dur, type, vol, isMusic) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.type = type;
  o.frequency.value = freq;
  g.gain.setValueAtTime(vol, start);
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur * 0.95);
  o.connect(g).connect(audio.destination);
  o.start(start);
  o.stop(start + dur);
  if (isMusic) musicNodes.push(o);
}

function noise(dur, vol, filterFreq) {
  const now = audio.currentTime;
  const src = audio.createBufferSource();
  src.buffer = noiseBuf;
  const f = audio.createBiquadFilter();
  f.type = "lowpass";
  f.frequency.value = filterFreq;
  const g = audio.createGain();
  g.gain.setValueAtTime(vol, now);
  g.gain.exponentialRampToValueAtTime(0.0001, now + dur);
  src.connect(f).connect(g).connect(audio.destination);
  src.start(now);
  src.stop(now + dur);
}

function playSongOnce() {
  musicNodes = [];
  let t = audio.currentTime + 0.1;
  for (const [n, beats] of SONG) {
    const d = beats * BEAT;
    tone(NOTE[n],     t, d, "square",   0.05, true);  // 8-bit lead
    tone(NOTE[n] / 2, t, d, "triangle", 0.06, true);  // softer low copy
    t += d;
  }
  return t - audio.currentTime;   // how long the song lasts
}

function startMusic() {
  stopMusic();
  musicOn = true;
  const loop = () => {
    if (!musicOn) return;
    const len = playSongOnce();
    musicTimer = setTimeout(loop, (len + 1.2) * 1000);  // repeat with a short pause
  };
  loop();
}

function stopMusic() {
  musicOn = false;
  clearTimeout(musicTimer);
  for (const o of musicNodes) { try { o.stop(); } catch (e) { /* already stopped */ } }
  musicNodes = [];
}

const soundWhoosh = () => audio && noise(0.8, 0.3, 900);    // blowing the candles
const soundPop    = () => audio && noise(0.35, 0.05, 1500); // firework burst
function soundTada() {
  if (!audio) return;
  const t = audio.currentTime + 0.05;
  ["C5", "E5", "G5"].forEach((n, i) => tone(NOTE[n], t + i * 0.12, 0.15, "square", 0.05));
  ["C5", "E5", "G5", "C6"].forEach(n => tone(NOTE[n], t + 0.36, 1.2, "square", 0.035));
}

// Pause sound when the user leaves the page
document.addEventListener("visibilitychange", () => {
  if (!audio) return;
  if (document.hidden) audio.suspend(); else audio.resume();
});

// =============================================================
// 5. BACKGROUND: confetti, balloons, fireworks, smoke
// =============================================================
const confetti = [], balloons = [], rockets = [], sparks = [], smoke = [];

for (let i = 0; i < 70; i++) {
  confetti.push({ x: rand(view.left, view.right), y: rand(view.top, view.bottom),
                  vy: rand(12, 30), ph: rand(0, 6.28), s: rand(0.8, 1.6), a: rand(0.15, 0.45) });
}

// The shape of one balloon: dots inside an oval
const BALLOON_DOTS = [];
for (let y = -20; y <= 20; y += 4)
  for (let x = -16; x <= 16; x += 4)
    if ((x / 16) ** 2 + (y / 20) ** 2 <= 1) BALLOON_DOTS.push([x, y]);
BALLOON_DOTS.push([0, 23]);   // the little knot

for (let i = 0; i < 6; i++) {
  balloons.push({ x: rand(view.left + 20, view.right - 20), y: rand(view.top, view.bottom),
                  speed: rand(14, 24), ph: rand(0, 6.28) });
}

function launchFirework() {
  rockets.push({ x: rand(view.left + 30, view.right - 30), y: view.bottom,
                 ty: rand(view.top + 50, 300) });
}

function burst(x, y, big) {
  const n = big ? 44 : 30;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, sp = rand(70, big ? 160 : 130);
    sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0, max: rand(1.1, 1.8) });
  }
  soundPop();
}

function spawnSmoke(x, y) {
  smoke.push({ x, y, vx: rand(-6, 6), vy: rand(-32, -18), life: 0, max: rand(1.6, 2.6), ph: rand(0, 6) });
}

// If the screen size changed (e.g. phone rotated), pull things back into view
const outsideX = x => x < view.left - 20 || x > view.right + 20;

function updateBackground(dt) {
  for (const c of confetti) {
    if (outsideX(c.x)) c.x = rand(view.left, view.right);
    c.y += c.vy * dt;
    c.x += Math.sin(time * 1.5 + c.ph) * 8 * dt;
    if (c.y > view.bottom + 5) { c.y = view.top - 5; c.x = rand(view.left, view.right); }
  }
  for (const b of balloons) {
    if (outsideX(b.x)) b.x = rand(view.left + 20, view.right - 20);
    b.y -= b.speed * dt;
    if (b.y < view.top - 90) { b.y = view.bottom + 40; b.x = rand(view.left + 20, view.right - 20); }
  }
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.y -= 380 * dt;
    if (r.y <= r.ty) { burst(r.x, r.ty, false); rockets.splice(i, 1); }
  }
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i];
    s.vx -= s.vx * 1.2 * dt;            // air drag
    s.vy += (60 - s.vy * 1.2) * dt;     // gravity + drag
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.life += dt;
    if (s.life > s.max) sparks.splice(i, 1);
  }
  for (let i = smoke.length - 1; i >= 0; i--) {
    const s = smoke[i];
    s.x += (s.vx + Math.sin(s.life * 3 + s.ph) * 8) * dt;
    s.y += s.vy * dt;
    s.life += dt;
    if (s.life > s.max) smoke.splice(i, 1);
  }
}

function drawBackground() {
  for (const c of confetti) dot(c.x, c.y, c.s, c.a);
  for (const b of balloons) {
    const sway = Math.sin(time * 0.8 + b.ph) * 6;
    for (const [dx, dy] of BALLOON_DOTS) dot(b.x + sway + dx, b.y + dy, 1.3, 0.28);
    for (let k = 0; k < 12; k++) {     // the string
      dot(b.x + sway * (1 - k / 12) + Math.sin(time * 2 + b.ph + k * 0.5) * 1.5,
          b.y + 27 + k * 4.5, 0.8, 0.18);
    }
  }
  for (const r of rockets) {
    dot(r.x, r.y, 1.6, 0.9); dot(r.x, r.y + 6, 1.2, 0.4); dot(r.x, r.y + 12, 1, 0.2);
  }
  for (const s of sparks) dot(s.x, s.y, 1.5, (1 - s.life / s.max) * 0.9);
}

function drawSmoke() {
  for (const s of smoke) {
    const k = s.life / s.max;
    dot(s.x, s.y, 1.2 + k * 2.5, (1 - k) * 0.35);
  }
}

// =============================================================
// 6. THE 3D CAKE
// Every dot has a 3D position (x, y, z). Each frame we rotate all
// dots around the vertical axis, then flatten them onto the screen.
// =============================================================
const CAKE_X = 180, CAKE_Y = 470;   // where the bottom-centre of the cake sits
const TILT = 0.35;                   // how much we look from above (0 = side view)
const cakePts = [];
const CANDLES = [];

function addPt(x, y, z, size, alpha) {
  cakePts.push({ x, y, z, size, alpha, sx: 0, sy: 0, d: 0, fromX: 0, fromY: 0, delay: 0 });
}

// One round layer of cake. baseY = bottom of the layer, h = height,
// hiddenR = radius covered by the layer on top (no need to draw it).
function tier(R, baseY, h, hiddenR) {
  const n = Math.round((2 * Math.PI * R) / 8);
  const rows = Math.round(h / 8);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
    // Wavy frosting: drips hang lower at some angles. This is what makes
    // the rotation visible - a perfectly plain cylinder would look still.
    const drip = 6 + 14 * Math.pow(Math.max(0, Math.sin(a * 7)), 3);
    for (let k = 1; k <= rows; k++) {
      const hh = (k * h) / rows;
      const isFrosting = hh >= h - drip;
      addPt(R * c, baseY - hh, R * s, isFrosting ? 2.0 : 1.6, isFrosting ? 1 : 0.5);
    }
    if (i % 2 === 0) addPt(R * 1.03 * c, baseY, R * 1.03 * s, 2.6, 1);   // pearl border
  }
  // Top surface as rings of dots
  for (let rr = R - 8; rr > hiddenR; rr -= 9) {
    const m = Math.round((2 * Math.PI * rr) / 8);
    for (let j = 0; j < m; j++) {
      const a = (j / m) * Math.PI * 2;
      addPt(rr * Math.cos(a), baseY - h, rr * Math.sin(a), 1.7, 0.8);
    }
  }
}

function buildCakeModel() {
  // Plate: two rings
  for (const R of [112, 104]) {
    const n = Math.round((2 * Math.PI * R) / 7);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2;
      addPt(R * Math.cos(a), 2, R * Math.sin(a), 1.6, 0.35);
    }
  }
  tier(95, 0, 60, 65);    // bottom layer
  tier(65, -60, 45, 0);   // top layer
  addPt(0, -105, 0, 1.7, 0.8);

  // Decorations on the bottom layer (big dots) - also help show rotation
  for (let k = 0; k < 5; k++) {
    const a = k * (Math.PI * 2 / 5) + 0.3;
    addPt(97 * Math.cos(a), -24, 97 * Math.sin(a), 2.8, 1);
  }

  // Three candles on the top layer, placed off-centre so they orbit
  for (let k = 0; k < 3; k++) {
    const a = k * (Math.PI * 2 / 3) + 0.5;
    const x = 32 * Math.cos(a), z = 32 * Math.sin(a);
    for (let hh = 0, j = 0; hh <= 28; hh += 5, j++) {
      addPt(x, -105 - hh, z, 1.9, j % 2 ? 0.6 : 1);   // striped candle
    }
    CANDLES.push({ x, z, topY: -105 - 34 });
  }
}
buildCakeModel();

// Rotate a 3D point around the vertical axis and flatten it to the screen
function project(x, y, z, angle) {
  const c = Math.cos(angle), s = Math.sin(angle);
  const xr = x * c - z * s;
  const zr = x * s + z * c;          // positive = closer to the viewer
  const persp = 1 + zr * 0.0015;     // closer dots spread out slightly
  return { sx: CAKE_X + xr * persp, sy: CAKE_Y + y + zr * TILT, d: zr };
}

// Where each dot starts before flying into the cake (the play button)
function scatterCake() {
  for (const p of cakePts) {
    const a = rand(0, Math.PI * 2), r = rand(0, 60);
    p.fromX = 180 + Math.cos(a) * r;
    p.fromY = 330 + Math.sin(a) * r;
    p.delay = (-p.y / 170) * 1.2 + rand(0, 0.3);   // bottom first, top last
  }
}

function drawCake(angle, buildT) {
  for (const p of cakePts) {
    const q = project(p.x, p.y, p.z, angle);
    p.sx = q.sx; p.sy = q.sy; p.d = q.d;
  }
  cakePts.sort((a, b) => a.d - b.d);   // draw the back first, front last
  for (const p of cakePts) {
    const f = (p.d / 112 + 1) / 2;     // 0 = far back, 1 = front
    let x = p.sx, y = p.sy, a = p.alpha * (0.25 + 0.75 * f);
    if (buildT !== null) {             // still flying in
      const k = easeOut(clamp01((buildT - p.delay) / 1.0));
      x = lerp(p.fromX, p.sx, k);
      y = lerp(p.fromY, p.sy, k);
      a = lerp(0.6, a, k);
    }
    dot(x, y, p.size * (0.75 + 0.45 * f), a);
  }
}

function candleTops(angle) {
  return CANDLES.map(c => project(c.x, c.topY, c.z, angle));
}

function drawFlames(angle) {
  candleTops(angle).forEach((t, k) => {
    dot(t.sx + Math.sin(time * 13 + k) * 0.8, t.sy, 3.2 + Math.sin(time * 17 + k * 2) * 0.4, 1);
    dot(t.sx, t.sy - 5, 2.2, 0.85);
    dot(t.sx + Math.sin(time * 9 + k) * 1.2, t.sy - 9, 1.3, 0.6);
  });
}

// =============================================================
// 7. DOT TEXT
// Text is written invisibly with a normal font, then we check which
// pixels are filled and put a dot there.
// =============================================================
function makeTextDots(str, size, centerY, step) {
  const off = document.createElement("canvas");
  off.width = DESIGN_W;
  off.height = Math.ceil(size * 1.6);
  const g = off.getContext("2d");
  let fs = size;
  g.font = "bold " + fs + "px Verdana, Arial, sans-serif";
  while (g.measureText(str).width > DESIGN_W - 24 && fs > 10) {   // shrink long text to fit
    fs--;
    g.font = "bold " + fs + "px Verdana, Arial, sans-serif";
  }
  g.textAlign = "center";
  g.textBaseline = "middle";
  g.fillStyle = "#fff";
  g.fillText(str, DESIGN_W / 2, off.height / 2);
  const data = g.getImageData(0, 0, off.width, off.height).data;
  const dots = [];
  for (let y = 0; y < off.height; y += step)
    for (let x = 0; x < off.width; x += step)
      if (data[(Math.floor(y) * off.width + Math.floor(x)) * 4 + 3] > 128)
        dots.push({ x, y: centerY - off.height / 2 + y });
  dots.sort((a, b) => a.x - b.x);   // left to right, for the typing effect
  return { dots, size: step * 0.45 };
}

// progress 0..1 = how much of the text has "typed out"
function drawText(t, progress) {
  const shown = progress * (t.dots.length + 20);
  t.dots.forEach((p, i) => dot(p.x, p.y, t.size, clamp01((shown - i) / 20)));
}

const TXT_FOR   = makeTextDots("for " + CONFIG.name, 30, 440, 2.6);
const TXT_LINE1 = makeTextDots(CONFIG.line1, 34, 548, 2.8);
const TXT_NAME  = makeTextDots(CONFIG.name + "!", 64, 612, 3.6);
const TXT_WISH  = makeTextDots(CONFIG.wish, 34, 245, 2.8);
const TXT_FROM  = makeTextDots(CONFIG.from, 22, 676, 2.2);

// The play button: a ring of dots with a triangle inside
const PLAY_DOTS = [];
for (let i = 0; i < 40; i++) {
  const a = (i / 40) * Math.PI * 2;
  PLAY_DOTS.push([Math.cos(a) * 58, Math.sin(a) * 58]);
}
for (let x = -18; x <= 26; x += 6)
  for (let y = -24; y <= 24; y += 6)
    if (Math.abs(y) <= 24 * (1 - (x + 18) / 44) + 0.01) PLAY_DOTS.push([x + 4, y]);

// =============================================================
// 8. SCENES (what happens when)
//   start  -> play button
//   build  -> dots fly in and build the cake, music starts
//   main   -> cake rotates, text types out, then "tap to blow"
//   blown  -> flames out, smoke, "Make a wish!"
//   finale -> lots of fireworks
//   end    -> "From Dylan" + replay
// =============================================================
let scene = "start", sceneTime = 0, time = 0;
let angle = 0, nextFirework = 0, smokeTimer = 0;

function setScene(s) { scene = s; sceneTime = 0; }

function startShow() {
  initAudio();
  startMusic();
  scatterCake();
  smoke.length = 0;
  nextFirework = 1.5;
  setScene("build");
}

function blowCandles() {
  stopMusic();
  soundWhoosh();
  setScene("blown");
}

function update(dt) {
  time += dt;
  sceneTime += dt;
  updateBackground(dt);
  if (scene === "start") return;

  angle += dt * 0.6;   // rotation speed (radians per second)

  nextFirework -= dt;
  if (nextFirework <= 0) {
    launchFirework();
    nextFirework = scene === "finale" ? rand(0.15, 0.3) : rand(1.6, 2.8);
  }

  if (scene === "build" && sceneTime > 2.6) setScene("main");

  if (scene === "blown") {
    smokeTimer -= dt;
    if (sceneTime < 1.5 && smokeTimer <= 0) {
      candleTops(angle).forEach(t => spawnSmoke(t.sx, t.sy));
      smokeTimer = 0.08;
    }
    if (sceneTime > 4.5) {
      setScene("finale");
      soundTada();
      for (let k = 0; k < 5; k++) burst(rand(view.left + 40, view.right - 40), rand(80, 280), true);
    }
  }

  if (scene === "finale" && sceneTime > 3) setScene("end");
}

function draw() {
  // Clear the whole screen to black
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Switch to design coordinates
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);

  drawBackground();

  if (scene === "start") {
    const pulse = 1 + 0.06 * Math.sin(time * 3);
    for (const [x, y] of PLAY_DOTS) dot(180 + x * pulse, 330 + y * pulse, 1.8, 0.95);
    drawText(TXT_FOR, 1);
    label("tap to play", 180, 500, 14, 0.35 + 0.25 * Math.sin(time * 3));
    return;
  }

  drawCake(angle, scene === "build" ? sceneTime : null);

  const flamesLit = scene === "build" ? sceneTime > 2.2 : scene === "main";
  if (flamesLit) drawFlames(angle);
  drawSmoke();

  // Birthday text types out once the cake is built
  if (scene === "main") {
    drawText(TXT_LINE1, clamp01(sceneTime / 1.4));
    drawText(TXT_NAME, clamp01((sceneTime - 1.0) / 1.2));
    if (sceneTime > 3.5) label("tap anywhere to blow the candles", 180, 700, 14, 0.35 + 0.25 * Math.sin(time * 3));
  } else if (scene !== "build") {
    drawText(TXT_LINE1, 1);
    drawText(TXT_NAME, 1);
  }

  if (scene === "blown")  drawText(TXT_WISH, clamp01((sceneTime - 2) / 1.5));
  if (scene === "finale" || scene === "end") drawText(TXT_WISH, 1);

  if (scene === "end") {
    drawText(TXT_FROM, clamp01(sceneTime / 1.5));
    if (sceneTime > 2) label("tap anywhere to replay", 180, 705, 13, 0.3 + 0.2 * Math.sin(time * 3));
  }
}

// =============================================================
// 9. INPUT + MAIN LOOP
// =============================================================
canvas.addEventListener("pointerdown", () => {
  if (audio) audio.resume();   // iPhones sometimes pause audio
  if (scene === "start") startShow();
  else if (scene === "main" && sceneTime > 3.5) blowCandles();
  else if (scene === "end" && sceneTime > 2) startShow();
});

let last = performance.now();
function frame(now) {
  const dt = Math.min((now - last) / 1000, 0.05);   // seconds since last frame
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
